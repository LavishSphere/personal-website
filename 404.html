<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="/js/theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, follow">
    <title>Page Not Found | Ashsmith Khayrul</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-section {
            min-height: calc(100vh - 200px);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 60px 0;
        }

        .error-code {
            font-size: 5em;
            font-weight: 800;
            color: var(--accent);
            line-height: 1;
            margin-bottom: 12px;
        }

        .error-title {
            font-size: 1.7em;
            margin-bottom: 12px;
        }

        .error-message {
            color: var(--text-secondary);
            margin-bottom: 28px;
        }

        .error-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .error-actions .text-link {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="nav-inner">
            <a href="/#home" class="logo">AK</a>
            <nav class="main-nav" id="main-nav">
                <a href="/#home" class="nav-link">Home</a>
                <a href="/#experience" class="nav-link">Experience</a>
                <a href="/#projects" class="nav-link">Projects</a>
                <a href="/#writing" class="nav-link">Writing</a>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" class="icon-btn" aria-label="Toggle color theme">
                    <i class="fa-solid fa-moon theme-icon-dark"></i>
                    <i class="fa-solid fa-sun theme-icon-light"></i>
                </button>
                <a href="/cdn/resume.pdf" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                    <span>Resume</span> <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
                <button class="icon-btn nav-toggle" id="nav-toggle" aria-label="Toggle menu" aria-expanded="false">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>
        </div>
    </header>
    <div class="nav-backdrop" id="nav-backdrop"></div>

    <main class="container">
        <section class="error-section">
            <div>
                <p class="error-code">404</p>
                <h1 class="error-title">Page not found</h1>
                <p class="error-message">The page you're looking for doesn't exist.</p>
                <div class="error-actions">
                    <a href="/" class="btn btn-primary"><span>Back to Home</span></a>
                    <a href="javascript:history.back()" class="text-link">Go back</a>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <div class="footer-inner">
                <div class="footer-brand">
                    <span class="logo">AK</span>
                    <span>Ashsmith Khayrul</span>
                </div>
                <div class="footer-social">
                    <a href="https://github.com/lavishsphere" target="_blank" rel="noopener noreferrer" aria-label="GitHub"><i class="fa-brands fa-github"></i></a>
                    <a href="https://linkedin.com/in/ashsmithk" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                    <a href="mailto:me@khayrul.com" aria-label="Email"><i class="fa-solid fa-envelope"></i></a>
                </div>
            </div>
            <p class="copyright">&copy; 2026 Ashsmith Khayrul. All rights reserved.</p>
        </footer>
    </main>

    <script src="/js/script.js"></script>
</body>
</html>
